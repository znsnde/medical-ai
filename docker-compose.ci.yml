# CI 专属 compose override：构建镜像时启用 GitHub Actions 层缓存（gha）
# 仅 CI 使用（docker compose -f docker-compose.yml -f docker-compose.ci.yml build），
# 本地开发构建不受影响。cache_from/cache_to 是 Compose spec 标准字段，
# 不依赖 docker compose build 的 CLI flags（v5 已移除 --cache-from/--cache-to）。
services:
  backend:
    build:
      context: ./backend
      cache_from:
        - type=gha
      cache_to:
        - type=gha,mode=max
  frontend:
    build:
      context: ./frontend
      cache_from:
        - type=gha
      cache_to:
        - type=gha,mode=max
