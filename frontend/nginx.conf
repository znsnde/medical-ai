# 智慧医疗前端 nginx 配置（容器内）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history 模式：刷新子路由不 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代（生产环境 vite proxy 不生效，前端 axios baseURL 为相对 /api）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 大文件上传 + AI 解析最长等 2 分钟
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 上传文件（报告PDF/DICOM/文献）经受控下载接口（/api/.../pdf/download）返回，
    # /static 历史路径显式拒绝，避免被 SPA 兜底（try_files → /index.html）误响应为 200
    location /static/ {
        return 404;
    }
}
