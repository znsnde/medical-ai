# 智慧医疗辅助诊断与电子病历结构化系统 —— 一键部署
#
# 用法：
#   1. 复制 backend/.env.example → backend/.env 并填写真实密钥
#   2. （可选）复制 .env.example → .env 自定义端口/密码/镜像源
#   3. docker compose up -d --build
#
# 说明：
#   - 数据存储（MySQL/Neo4j/Milvus）不发布宿主端口，仅容器内部网络互通，
#     与本机已运行的 3306/7687/19530 服务零端口冲突。
#   - 真实密钥经 env_file: backend/.env 运行时注入，不进入镜像层。
#   - 国内网络可在 .env 设置 REGISTRY 镜像前缀（示例见 .env.example）。

services:
  mysql:
    image: ${REGISTRY:-}mysql:8.0
    container_name: medical-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-medical_db}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  neo4j:
    image: ${REGISTRY:-}neo4j:5-community
    container_name: medical-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASS:-12345678}
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_server_memory_heap_max__size: 512M
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASS:-12345678}' 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # ── Milvus 依赖栈（复用已有华为云镜像，国内可拉） ──
  etcd:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/registry.k8s.io/etcd:3.5.5-0
    container_name: medical-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 -data-dir /etcd

  minio:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: medical-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/milvusdb/milvus:v2.4.5
    container_name: medical-milvus
    restart: unless-stopped
    command: milvus run standalone
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    image: medical-ai-backend
    container_name: medical-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # 覆盖 .env 中的本机地址为容器内服务名
      DB_URL: "mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-123456}@mysql:3306/${MYSQL_DATABASE:-medical_db}?charset=utf8mb4"
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASS: ${NEO4J_PASS:-12345678}
      SERVER_PORT: "8000"
      HF_ENDPOINT: https://hf-mirror.com
      # 嵌入模型已在镜像内预缓存；禁止运行时向 HF 发远程校验（本机/演示网连不上 hf-mirror，
      # 否则每次 RAG 首调会因 SSL 重试卡 ~110s），纯本地加载秒级完成
      HF_HUB_OFFLINE: "1"
      CORS_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173
    volumes:
      # 上传内容（DICOM/论文/PDF 报告）+ 参考影像持久化到宿主
      - ./backend/static:/app/static
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      milvus:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    image: medical-ai-frontend
    container_name: medical-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  neo4j_data:
  etcd_data:
  minio_data:
  milvus_data:
